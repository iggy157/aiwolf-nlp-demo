# 自動生成: scripts/gen_i18n.py。編集しないこと。
# 言語別ゲームサーバ（ja以外）。base の game-server がビルドする aiwolf-nlp-game-server:local を共有。
# 使い方: docker compose -f docker-compose.yml -f docker-compose.langs.yml up
services:
  game-server-en:
    image: aiwolf-nlp-game-server:local
    command:
    - -c
    - /app/configs/generated/server.en.yml
    volumes:
    - ./configs:/app/configs:ro
    - ./log:/app/log
    expose:
    - '8080'
    depends_on:
    - game-server
    restart: unless-stopped
